<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搖曳露營 GALGAME Prototype</title>
  <style>
    :root {
      --bg: #f6f1e8;
      --ink: #213131;
      --muted: #667371;
      --line: #d8d0c4;
      --paper: #fffaf0;
      --white: #fffdf8;
      --green: #2f8b7d;
      --green-dark: #17685d;
      --yellow: #d59a2f;
      --blue: #3b78a4;
      --red: #bd5b4d;
      --soft: #edf5ef;
      --shadow: 0 16px 34px rgba(37, 47, 45, .12);
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,0) 360px),
        repeating-linear-gradient(90deg, rgba(47,139,125,.06) 0 1px, transparent 1px 72px),
        var(--bg);
    }

    button {
      color: inherit;
      font: inherit;
    }

    .app {
      width: min(1240px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 22px 0 34px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--line);
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      max-width: 760px;
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      padding: 0 14px;
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease, background .12s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--green);
    }

    .btn.primary {
      color: #fff;
      background: var(--green);
      border-color: var(--green);
      font-weight: 700;
    }

    .btn.primary:hover { background: var(--green-dark); }
    .btn:disabled {
      cursor: not-allowed;
      opacity: .5;
      transform: none;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.28fr) minmax(340px, .72fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 250, 240, .9);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,.58);
    }

    .panel-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .content { padding: 16px; }

    .tag {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 0 10px;
      color: var(--green-dark);
      background: rgba(47,139,125,.12);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .tag.yellow {
      color: #805313;
      background: rgba(213,154,47,.16);
    }

    .tag.blue {
      color: #245a82;
      background: rgba(59,120,164,.14);
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .day {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 8px;
      background: var(--white);
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    .day.active {
      border-color: var(--green);
      color: var(--green-dark);
      background: rgba(47,139,125,.1);
      font-weight: 800;
    }

    .scene {
      position: relative;
      min-height: 210px;
      margin-bottom: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background:
        radial-gradient(circle at 82% 22%, rgba(255,203,108,.7) 0 48px, transparent 50px),
        linear-gradient(180deg, #dbeef0 0%, #f8e3c5 52%, #bcd8ad 53%, #92b780 100%);
    }

    .scene::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 58px;
      height: 110px;
      clip-path: polygon(0 100%, 18% 28%, 30% 76%, 45% 18%, 62% 78%, 78% 26%, 100% 100%);
      background: linear-gradient(180deg, #8ba79e, #536f69);
      opacity: .72;
    }

    .scene::after {
      content: "";
      position: absolute;
      left: 44px;
      bottom: 38px;
      width: 138px;
      height: 76px;
      background: #d56f3e;
      clip-path: polygon(50% 0, 100% 100%, 0 100%);
      filter: drop-shadow(0 10px 9px rgba(33,49,49,.22));
    }

    .scene-label {
      position: absolute;
      z-index: 1;
      left: 16px;
      top: 14px;
      max-width: min(540px, calc(100% - 32px));
      border-radius: 8px;
      padding: 12px 14px;
      background: rgba(255,253,248,.78);
      backdrop-filter: blur(6px);
      line-height: 1.6;
      color: var(--muted);
    }

    .event-title {
      margin-bottom: 8px;
      font-size: 26px;
      line-height: 1.22;
    }

    .dialogue {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      padding: 14px;
      min-height: 132px;
    }

    .speaker {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .avatar {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: #fff;
      background: var(--green);
      font-weight: 900;
      overflow: hidden;
      flex: 0 0 auto;
    }

    .avatar img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .dialogue p {
      margin-bottom: 0;
      color: var(--ink);
      line-height: 1.8;
      white-space: pre-line;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .choice {
      min-height: 116px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffdf8;
      padding: 12px;
      text-align: left;
      cursor: pointer;
    }

    .choice:hover {
      border-color: var(--green);
      box-shadow: 0 12px 22px rgba(47,139,125,.12);
    }

    .choice b {
      display: block;
      margin-bottom: 8px;
      line-height: 1.4;
    }

    .choice span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .item-card {
      position: relative;
      min-height: 154px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      padding: 12px;
    }

    .item-card.match {
      border-color: var(--yellow);
      box-shadow: 0 0 0 3px rgba(213,154,47,.12);
    }

    .corner {
      position: absolute;
      top: 10px;
      right: 10px;
      border-radius: 999px;
      padding: 4px 8px;
      color: #805313;
      background: rgba(213,154,47,.18);
      font-size: 12px;
      font-weight: 800;
    }

    .item-card h3 {
      margin: 0 0 8px;
      padding-right: 84px;
      font-size: 17px;
      line-height: 1.35;
    }

    .item-card p {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .tags {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .mini-tag {
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--green-dark);
      background: rgba(47,139,125,.1);
      font-size: 12px;
      font-weight: 700;
    }

    .item-meta {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .checklist {
      display: grid;
      gap: 9px;
    }

    .check {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: var(--white);
    }

    .check.hinted { border-color: var(--yellow); }
    .check.done {
      border-color: var(--green);
      background: rgba(47,139,125,.08);
    }

    .status {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: #ece6dc;
      color: var(--muted);
      font-weight: 900;
      overflow: hidden;
    }

    .status img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hinted .status {
      color: #805313;
      background: rgba(213,154,47,.18);
    }

    .done .status {
      color: #fff;
      background: var(--green);
    }

    .check b {
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      line-height: 1.35;
    }

    .check span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .inventory {
      display: grid;
      gap: 8px;
    }

    .bag-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      padding: 9px 10px;
      font-size: 14px;
    }

    .bag-item small {
      display: block;
      margin-top: 3px;
      color: var(--muted);
    }

    .meters {
      display: grid;
      gap: 10px;
    }

    .meter-row {
      display: grid;
      grid-template-columns: 34px 56px 1fr 32px;
      align-items: center;
      gap: 8px;
      font-size: 13px;
    }

    .mini-avatar {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--line);
      background: var(--white);
    }

    .meter {
      height: 9px;
      border-radius: 999px;
      background: rgba(33,49,49,.1);
      overflow: hidden;
    }

    .meter span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--green);
    }

    .log {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .log li {
      border-left: 4px solid var(--green);
      border-radius: 6px;
      padding: 8px 10px;
      background: rgba(47,139,125,.08);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .empty {
      margin-bottom: 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 14px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .summary-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--white);
      padding: 10px;
    }

    .summary-card b {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .summary-card span {
      font-size: 22px;
      font-weight: 900;
    }

    .end-note {
      margin-top: 14px;
      border: 1px solid rgba(47,139,125,.35);
      border-radius: 8px;
      background: rgba(47,139,125,.08);
      padding: 12px 14px;
      color: var(--green-dark);
      line-height: 1.7;
    }

    .end-note b {
      display: block;
      margin-bottom: 4px;
      color: var(--ink);
    }

    @media (max-width: 980px) {
      .layout, .choices, .shop-grid {
        grid-template-columns: 1fr;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .toolbar { justify-content: flex-start; }
    }

    @media (max-width: 640px) {
      .app { width: min(100vw - 20px, 1240px); }
      .week { grid-template-columns: repeat(4, 1fr); }
      .summary { grid-template-columns: repeat(2, 1fr); }
      .scene { min-height: 250px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div>
        <h1>第一週測試版</h1>
        <p class="subtitle">看角色對話，記下她們下次露營想要的東西。採買時有顏色標記與提示，買到符合分類的物品後 checklist 會打勾，週末依完成度演出不同劇情。</p>
      </div>
      <div class="toolbar">
        <button class="btn" id="helpBtn">玩法</button>
        <button class="btn primary" id="restartBtn">重新開始</button>
      </div>
    </section>

    <section class="layout">
      <div class="panel">
        <div class="panel-header">
          <h2 id="phaseTitle">週一</h2>
          <span class="tag" id="moneyTag">預算 3000</span>
        </div>
        <div class="content">
          <div class="week" id="week"></div>
          <div class="scene">
            <div class="scene-label" id="sceneLabel">第一週的目標：把角色說過的小事，變成真正準備好的露營。</div>
          </div>
          <h2 class="event-title" id="eventTitle"></h2>
          <div class="dialogue">
            <div class="speaker">
              <div class="avatar" id="speakerAvatar">主</div>
              <span id="speakerName">主角</span>
            </div>
            <p id="dialogueText"></p>
          </div>
          <div id="mainAction"></div>
        </div>
      </div>

      <aside class="side">
        <div class="panel">
          <div class="panel-header">
            <h2>下次露營 Checklist</h2>
            <span class="tag yellow" id="checkProgress">0 / 0</span>
          </div>
          <div class="content">
            <div class="checklist" id="checklist"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>背包</h2>
            <span class="tag blue" id="loadTag">0 / 10</span>
          </div>
          <div class="content">
            <div class="inventory" id="inventory"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>角色狀態</h2>
            <span class="tag">第一週</span>
          </div>
          <div class="content">
            <div class="meters" id="meters"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>露營筆記</h2>
            <span class="tag">Log</span>
          </div>
          <div class="content">
            <ul class="log" id="log"></ul>
          </div>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const days = ["週一", "週二", "週三", "週四", "週五", "週六", "週日"];
    const daySubtitles = ["野活參觀", "書店偶遇", "群組聊天", "採買準備", "最後確認", "湖畔露營", "露營日記"];

    const characters = {
      player: { name: "主角", avatar: "主", color: "#2f8b7d" },
      nadeshiko: { name: "各務原撫子", avatar: "撫", color: "#d56f3e", img: "img/nadeshiko.jpg", campImg: "img/nadeshiko_camp.jpg", affection: 0, trust: 0, sync: 0, tendency: 0 },
      rin: { name: "志摩凜", avatar: "凜", color: "#3b78a4", img: "img/rin.jpg", campImg: "img/rin_camp.jpg", affection: 0, trust: 0, sync: 0, tendency: 0 },
      chiaki: { name: "大垣千明", avatar: "千", color: "#a06a22", img: "img/chiaki.jpg", campImg: "img/chiaki_camp.jpg", affection: 0, trust: 0, sync: 0, tendency: 0 }
    };

    const items = [
      item("warmer", "暖暖包", 300, 1, ["保暖"], "便宜又直接的防寒用品。", { warmth: 8 }),
      item("blanket", "羊毛毯", 1200, 2, ["保暖", "療癒"], "晚上坐在營火邊會很舒服。", { warmth: 12, chill: 5 }),
      item("jacket", "防風外套", 2500, 2, ["保暖", "體力"], "湖邊風大時特別有用。", { warmth: 10, stamina: 5 }),
      item("bottle", "保溫瓶", 1500, 1, ["熱飲", "保暖"], "可以把熱飲帶到湖邊。", { warmth: 6, chill: 4 }),
      item("cocoa", "熱可可粉", 500, 1, ["熱飲", "甜點"], "甜甜的熱飲，適合夜晚談心。", { chill: 8 }),
      item("coffee", "咖啡濾掛包", 600, 1, ["熱飲", "安靜"], "安靜看風景時很搭。", { chill: 6 }),
      item("curry_noodle", "咖哩麵", 300, 1, ["熱料理", "主食"], "便宜、輕、熱呼呼。", { cooking: 8 }),
      item("hotpot", "番茄鍋食材", 1800, 2, ["熱料理", "團體"], "適合大家圍著一起吃。", { cooking: 14, bond: 4 }),
      item("pasta", "湯義大利麵材料", 1200, 2, ["熱料理", "主食"], "撫子會很期待的晚餐。", { cooking: 12 }),
      item("yakisoba", "富士宮炒麵材料", 1000, 2, ["主食", "團體"], "主食系，容易炒出香氣。", { cooking: 9, bond: 4 }),
      item("windshield", "百元風防材料", 300, 1, ["省錢", "改造"], "千明會喜歡的低成本改造素材。", { bond: 4 }),
      item("rope", "萬用繩", 500, 1, ["改造", "補救"], "能處理很多臨時狀況。", { trust: 3 }),
      item("cheap_wood", "折扣薪柴", 600, 2, ["省錢", "保暖"], "便宜但能讓營火燒得更安心。", { warmth: 7 }),
      item("chair", "低椅", 2200, 2, ["安靜", "療癒"], "坐下來看湖景會很放鬆。", { chill: 10 }),
      item("starmap", "星空地圖", 800, 1, ["風景", "安靜"], "晚上可以一起找星星。", { scenery: 8 })
    ];

    const events = [
      {
        day: 0,
        title: "轉學後的第一個邀請",
        scene: "放學後，撫子在走廊上聽見你提到露營雜誌，眼睛立刻亮了起來。",
        speaker: "nadeshiko",
        text: "欸欸，你也對露營有興趣嗎？我們學校有野外活動社喔！雖然社辦有點小，但是大家一起準備露營超開心的！",
        choices: [
          choice("去看看野活吧", "參觀野活，撫子很高興。", { nadeshiko: { affection: 3, tendency: 2 }, bond: 3 }, []),
          choice("先問問需要準備什麼", "你先確認露營基本需求。", { nadeshiko: { trust: 2 }, stamina: 3 }, []),
          choice("有吃的話我就去", "撫子大力點頭，氣氛變輕鬆。", { nadeshiko: { affection: 2, sync: 1 }, bond: 2 }, [])
        ]
      },
      {
        day: 1,
        title: "書店的露營雜誌",
        scene: "書店角落的露營雜誌只剩最後一本。你的手剛伸出去，旁邊也有人伸手拿同一本。",
        speaker: "rin",
        text: "啊。你也要看這本？\n這期有湖畔營地特集。那邊晚上大概會很冷，不過風景應該很好。",
        choices: [
          choice("那我先查夜間氣溫", "凜注意到你沒有只看漂亮照片，也在意安全。", { rin: { trust: 2, sync: 2 }, scenery: 2 }, [
            check("rin_warm", "準備保暖物品", "凜提到湖邊晚上會很冷。", "rin", ["保暖"])
          ]),
          choice("風景好的話很值得去", "你回應了凜對風景的期待。", { rin: { affection: 2, tendency: 2 }, scenery: 4 }, [
            check("rin_warm", "準備保暖物品", "凜提到湖邊晚上會很冷。", "rin", ["保暖"])
          ]),
          choice("要不要大家一起去？", "凜沒有拒絕，但看起來還在觀察距離。", { rin: { affection: 1, sync: -1 }, bond: 2 }, [
            check("rin_warm", "準備保暖物品", "凜提到湖邊晚上會很冷。", "rin", ["保暖"])
          ])
        ]
      },
      {
        day: 2,
        title: "野活群組的晚餐話題",

      {

        scene: "週五晚上，凜傳來天氣截圖。湖邊夜間氣溫比預想更低。",
        speaker: "rin",
        text: "明天晚上可能只有 2 度。\n如果有熱飲，應該會舒服很多。沒準備也不是不能去，只是會比較辛苦。",
        choices: [

            check("rin_drink", "準備熱飲", "凜提到夜晚如果有熱飲會舒服很多。", "rin", ["熱飲"])
          ], "shop"),
          choice("再檢查一次背包", "你把所有準備重新確認。", { rin: { trust: 2 }, stamina: 2 }, [

          ], "shop"),
          choice("冷到發抖也算回憶吧", "凜回了一個沉默的貼圖。你決定還是去買點熱的。", { rin: { affection: 1, sync: -1 }, bond: 1 }, [
            check("rin_drink", "準備熱飲", "凜提到夜晚如果有熱飲會舒服很多。", "rin", ["熱飲"])
          ], "shop")
        ]
      }
    ];

    let state;

    function item(id, name, price, weight, tags, desc, effects) {
      return { id, name, price, weight, tags, desc, effects };
    }

    function check(id, label, sourceText, sourceCharacter, requiredTags) {
      return { id, label, sourceText, sourceCharacter, requiredTags, status: "hinted" };
    }

    function choice(label, desc, effects, checks, nextMode) {
      return { label, desc, effects, checks, nextMode };
    }

    function newGame() {
      state = {
        day: 0,
        mode: "event",
        budget: 3000,
        stamina: 60,
        loadMax: 10,
        stats: { warmth: 0, scenery: 0, cooking: 0, bond: 0, chill: 0 },
        characters: JSON.parse(JSON.stringify(characters)),
        checklist: [],
        bag: [],
        shop: [],
        log: ["週一開始。目標是把角色說過的小事，變成露營當天的準備。"],
        campResult: null,
        finished: false
      };
      delete state.characters.player.affection;
      render();
    }

    function totalLoad() {
      return state.bag.reduce((sum, it) => sum + it.weight, 0);
    }

    function doneChecks() {
      return state.checklist.filter((c) => c.status === "done").length;
    }

    function addChecks(checks) {
      checks.forEach((next) => {
        if (!state.checklist.some((c) => c.id === next.id)) {
          state.checklist.push(next);
          state.log.unshift(`${state.characters[next.sourceCharacter].name} 的提示已記錄：「${next.label}」。`);
        }
      });
      updateChecklistStatus();
    }

    function applyEffects(effects) {
      Object.keys(effects || {}).forEach((key) => {
        if (state.characters[key]) {
          Object.keys(effects[key]).forEach((stat) => {
            state.characters[key][stat] += effects[key][stat];
          });
        } else if (key in state.stats) {
          state.stats[key] += effects[key];
        } else if (key === "stamina") {
          state.stamina = Math.max(0, Math.min(100, state.stamina + effects[key]));
        }
      });
    }

    function pickChoice(index) {
      const current = events[state.day];
      const picked = current.choices[index];
      applyEffects(picked.effects);
      addChecks(picked.checks);
      state.log.unshift(`你選擇：「${picked.label}」${picked.desc}`);

      if (picked.nextMode === "shop") {
        openShop();
        return;
      }

      state.day += 1;
      state.mode = "event";
      render();
    }

    function openShop() {
      state.mode = "shop";
      state.shop = buildShop();
      render();
    }

    function buildShop() {
      const guaranteed = [];
      const neededTags = state.checklist
        .filter((c) => c.status !== "done")
        .flatMap((c) => c.requiredTags);
      const uniqueNeeded = [...new Set(neededTags)];

      uniqueNeeded.forEach((tag) => {
        const candidates = items.filter((it) => it.tags.includes(tag) && !guaranteed.some((g) => g.id === it.id));
        if (candidates.length) guaranteed.push(sample(candidates));
      });

      const requiredFallback = ["保暖", "熱飲", "熱料理", "省錢"];
      requiredFallback.forEach((tag) => {
        if (guaranteed.length >= 8) return;
        if (!guaranteed.some((it) => it.tags.includes(tag))) {
          const candidates = items.filter((it) => it.tags.includes(tag) && !guaranteed.some((g) => g.id === it.id));
          if (candidates.length) guaranteed.push(sample(candidates));
        }
      });

      const rest = items.filter((it) => !guaranteed.some((g) => g.id === it.id));
      while (guaranteed.length < 8 && rest.length) {
        const picked = sample(rest);
        guaranteed.push(picked);
        rest.splice(rest.findIndex((it) => it.id === picked.id), 1);
      }
      return guaranteed;
    }

    function sample(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    function matchingChecks(it) {
      return state.checklist.filter((c) =>
        c.status !== "done" && c.requiredTags.some((tag) => it.tags.includes(tag))
      );
    }

    function buyItem(id) {
      const it = state.shop.find((entry) => entry.id === id);
      if (!it) return;
      if (state.budget < it.price) {
        state.log.unshift(`預算不足，買不起「${it.name}」。`);
        render();
        return;
      }
      if (totalLoad() + it.weight > state.loadMax) {
        state.log.unshift(`背包太重，放不下「${it.name}」。`);
        render();
        return;
      }
      state.budget -= it.price;
      state.bag.push(it);
      applyItemEffects(it);
      state.log.unshift(`買下「${it.name}」，放進背包。`);
      updateChecklistStatus(true);
      render();
    }

    function applyItemEffects(it) {
      Object.keys(it.effects || {}).forEach((key) => {
        if (key in state.stats) state.stats[key] += it.effects[key];
        else if (key === "trust") {
          state.characters.chiaki.trust += 1;
          state.characters.rin.trust += 1;
        }
      });
      it.tags.forEach((tag) => {
        if (["熱料理", "主食"].includes(tag)) state.characters.nadeshiko.tendency += 2;
        if (["保暖", "熱飲", "安靜"].includes(tag)) state.characters.rin.tendency += 2;
        if (["省錢", "改造"].includes(tag)) state.characters.chiaki.tendency += 3;
      });
    }

    function updateChecklistStatus(fromPurchase) {
      state.checklist.forEach((c) => {
        const wasDone = c.status === "done";
        const matched = state.bag.some((it) => c.requiredTags.some((tag) => it.tags.includes(tag)));
        c.status = matched ? "done" : "hinted";
        if (fromPurchase && !wasDone && matched) {
          const charName = state.characters[c.sourceCharacter].name;
          state.log.unshift(`Checklist 完成：${charName} 的「${c.label}」。`);
        }
      });
    }

    function finishShopping() {
      if (state.day < 4) {
        state.day += 1;
        state.mode = "event";
      } else {
        state.day = 5;
        state.mode = "camp";
      }
      render();
    }

    function campResults() {
      if (state.campResult) return state.campResult;
      const hasWarm = isCheckDone("rin_warm");
      const hasDrink = isCheckDone("rin_drink");
      const hasFood = isCheckDone("nade_food");
      const hasBudget = isCheckDone("chiaki_budget");
      const completed = doneChecks();
      const total = Math.max(1, state.checklist.length);
      const percent = completed / total;
      const main = highestTendency();
      const score = Math.round(
        state.stats.warmth + state.stats.scenery + state.stats.cooking + state.stats.bond + state.stats.chill +
        state.stamina + completed * 10
      );

      const beats = [];
      if (!hasWarm) {
        beats.push("夜晚變冷時，主角開始發抖。凜默默遞出備用暖暖包，沒有多說什麼，但你把這次失誤記進了露營筆記。");
        state.characters.rin.trust += 1;
      } else if (hasWarm && hasDrink) {
        beats.push("營火旁，你拿出熱飲和保暖用品。凜接過杯子，看著湖面說：「準備得很周到。」這句話很短，但很像她。");
        state.characters.rin.affection += 4;
        state.characters.rin.sync += 4;
      } else {
        beats.push("湖邊確實很冷，但你準備的保暖物品派上用場。凜看了看你的背包，似乎稍微放心了。");
        state.characters.rin.affection += 2;
        state.characters.rin.sync += 2;
      }

      if (!hasFood) {
        beats.push("晚餐時間才發現熱食準備不足。撫子拿出備用泡麵，笑著說這也是露營的味道。雖然有點狼狽，但氣氛沒有冷掉。");
        state.characters.nadeshiko.affection += 1;
      } else {
        beats.push("熱呼呼的晚餐讓撫子眼睛發亮。她一邊吹涼湯匙，一邊已經開始討論下次想吃什麼。");
        state.characters.nadeshiko.affection += 4;
        state.characters.nadeshiko.trust += 2;
      }

      if (!hasBudget) {
        beats.push("千明看著帳單大喊預算快炸了，但還是把大家逗笑。她說下次一定要讓你見識真正的省錢露營。");
        state.characters.chiaki.affection += 1;
      } else if (hasBudget && hasFood) {
        beats.push("千明展示你們準備的省錢改造，還成功支援了晚餐。她得意地宣布：這就是野活的勝利。");
        state.characters.chiaki.affection += 4;
        state.characters.chiaki.trust += 3;
      } else {
        beats.push("省錢道具在搭營時派上用場。千明拍著你的肩膀，說你已經很有野活精神了。");
        state.characters.chiaki.affection += 3;
      }

      const rank = percent >= 1 ? "完美準備" : percent >= .75 ? "高品質體驗" : percent >= .4 ? "順利露營" : "勉強成行";
      state.campResult = { beats, completed, total, percent, score, rank, main };
      return state.campResult;
    }

    function isCheckDone(id) {
      return state.checklist.some((c) => c.id === id && c.status === "done");
    }

    function highestTendency() {
      return ["rin", "nadeshiko", "chiaki"]
        .map((id) => ({ id, value: state.characters[id].tendency }))
        .sort((a, b) => b.value - a.value)[0].id;
    }

    function isCampingScene() {
      return state.day >= 5 || state.mode === "camp" || state.mode === "diary";
    }

    function avatarSrc(id) {
      const char = state.characters[id];
      if (!char || !char.img) return "";
      return isCampingScene() ? char.campImg : char.img;
    }

    function avatarHtml(id, className = "") {
      const src = avatarSrc(id);
      const char = state.characters[id];
      if (!src) return "";
      return `<img class="${className}" src="${src}" alt="${char.name}">`;
    }

    function goToDiary() {
      state.day = 6;
      state.mode = "diary";
      state.finished = true;
      render();
    }

    function render() {
      renderHeader();
      renderWeek();
      renderMain();
      renderChecklist();
      renderInventory();
      renderMeters();
      renderLog();
    }

    function renderHeader() {
      document.getElementById("phaseTitle").textContent = `${days[state.day]}：${daySubtitles[state.day]}`;
      document.getElementById("moneyTag").textContent = `預算 ${state.budget}`;
    }

    function renderWeek() {
      document.getElementById("week").innerHTML = days.map((day, index) => `
        <div class="day ${index === state.day ? "active" : ""}">
          <b>${day}</b><br>${daySubtitles[index]}
        </div>
      `).join("");
    }

    function renderMain() {
      if (state.mode === "shop") return renderShop();
      if (state.mode === "camp") return renderCamp();
      if (state.mode === "diary") return renderDiary();

      const ev = events[state.day];
      const char = state.characters[ev.speaker];
      document.getElementById("sceneLabel").textContent = ev.scene;
      document.getElementById("eventTitle").textContent = ev.title;
      document.getElementById("speakerAvatar").innerHTML = avatarHtml(ev.speaker) || char.avatar;
      document.getElementById("speakerAvatar").style.background = char.color;
      document.getElementById("speakerName").textContent = char.name;
      document.getElementById("dialogueText").textContent = ev.text;
      document.getElementById("mainAction").innerHTML = `
        <div class="choices">
          ${ev.choices.map((c, index) => `
            <button class="choice" onclick="pickChoice(${index})">
              <b>${c.label}</b>
              <span>${c.desc}</span>
            </button>
          `).join("")}
        </div>
      `;
    }

    function renderShop() {
      document.getElementById("sceneLabel").textContent = "商店會優先出現 checklist 相關分類，但具體商品仍有隨機差異。黃色角標代表這件商品能完成某位角色提到的期待。";
      document.getElementById("eventTitle").textContent = "採買與打包";
      document.getElementById("speakerAvatar").innerHTML = "店";
      document.getElementById("speakerAvatar").style.background = "#2f8b7d";
      document.getElementById("speakerName").textContent = "戶外用品店";
      document.getElementById("dialogueText").textContent = "挑選下次露營要帶的東西。買到符合分類的物品後，右側 checklist 會即時打勾。";
      document.getElementById("mainAction").innerHTML = `
        <div class="shop-grid">
          ${state.shop.map((it) => renderShopItem(it)).join("")}
        </div>
        <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
          <button class="btn primary" onclick="finishShopping()">完成採買</button>
          <button class="btn" onclick="openShop()">換一批商品</button>
        </div>
      `;
    }

    function renderShopItem(it) {
      const matches = matchingChecks(it);
      const canBuy = state.budget >= it.price && totalLoad() + it.weight <= state.loadMax;
      const tooltip = matches.length
        ? matches.map((c) => `${state.characters[c.sourceCharacter].name}：「${c.sourceText}」`).join("\n")
        : "目前沒有直接對應 checklist，但仍可能提高體驗。";
      return `
        <div class="item-card ${matches.length ? "match" : ""}" title="${escapeAttr(tooltip)}">
          ${matches.length ? `<div class="corner">可完成 ${matches.length}</div>` : ""}
          <h3>${it.name}</h3>
          <p>${it.desc}</p>
          <div class="tags">${it.tags.map((tag) => `<span class="mini-tag">${tag}</span>`).join("")}</div>
          <div class="item-meta"><span>${it.price} 圓</span><span>重量 ${it.weight}</span></div>
          <button class="btn primary" onclick="buyItem('${it.id}')" ${canBuy ? "" : "disabled"}>${canBuy ? "購買" : "買不起 / 太重"}</button>
        </div>
      `;
    }

    function renderCamp() {
      const result = campResults();
      document.getElementById("sceneLabel").textContent = "湖畔的夜晚比想像中更冷。你這週記下來的每一句話，都會在這裡變成角色的反應。";
      document.getElementById("eventTitle").textContent = `週六湖畔露營：${result.rank}`;
      document.getElementById("speakerAvatar").innerHTML = avatarHtml(result.main) || "營";
      document.getElementById("speakerAvatar").style.background = state.characters[result.main].color;
      document.getElementById("speakerName").textContent = `露營當天：${state.characters[result.main].name}`;
      document.getElementById("dialogueText").textContent = result.beats.join("\n\n");
      document.getElementById("mainAction").innerHTML = `
        <div class="summary">
          <div class="summary-card"><b>完成目標</b><span>${result.completed}/${result.total}</span></div>
          <div class="summary-card"><b>體驗分</b><span>${result.score}</span></div>
          <div class="summary-card"><b>主要互動</b><span>${state.characters[result.main].avatar}</span></div>
          <div class="summary-card"><b>評價</b><span>${result.rank}</span></div>
        </div>
        <div style="margin-top:14px;">
          <button class="btn primary" onclick="goToDiary()">寫露營日記</button>
        </div>
      `;
    }

    function renderDiary() {
      const result = campResults();
      document.getElementById("sceneLabel").textContent = "週日早上，湖面很安靜。你把這週學到的事情寫進露營日記。";
      document.getElementById("eventTitle").textContent = "第一週結算";
      document.getElementById("speakerAvatar").innerHTML = avatarHtml(result.main) || "記";
      document.getElementById("speakerAvatar").style.background = state.characters[result.main].color;
      document.getElementById("speakerName").textContent = "露營日記";
      document.getElementById("dialogueText").textContent =
        `這週完成了 ${result.completed} / ${result.total} 個角色期待。\n` +
        `下週優先出現的事件傾向是：${state.characters[result.main].name}。\n\n` +
        nextHint(result.main) +
        "\n\n目前 prototype 到第一週結算為止。下一版會接續這個結果，進入第二週的角色事件。";
      document.getElementById("mainAction").innerHTML = `
        <div class="summary">
          <div class="summary-card"><b>凜 好感</b><span>${state.characters.rin.affection}</span></div>
          <div class="summary-card"><b>撫子 好感</b><span>${state.characters.nadeshiko.affection}</span></div>
          <div class="summary-card"><b>千明 好感</b><span>${state.characters.chiaki.affection}</span></div>
          <div class="summary-card"><b>體驗分</b><span>${result.score}</span></div>
        </div>
        <div class="end-note">
          <b>第一週測試版到此結束</b>
          這一版主要驗證「角色對話產生 checklist → 採買打勾 → 露營劇情回饋」是否有趣。下週內容尚未實作，現在可以重新測一次，試試不同選項與採買路線。
        </div>
        <div style="margin-top:14px;">
          <button class="btn primary" onclick="newGame()">再測一次</button>
        </div>
      `;
    }

    function nextHint(id) {
      if (id === "rin") return "凜似乎願意分享更多安靜營地的情報。下次也許可以準備更適合單人露營的東西。";
      if (id === "nadeshiko") return "撫子已經開始想下一次菜單。下次可能會出現更完整的料理準備。";
      return "千明對省錢企劃很滿意。下次也許能試試更誇張的野活改造方案。";
    }

    function renderChecklist() {
      const box = document.getElementById("checklist");
      document.getElementById("checkProgress").textContent = `${doneChecks()} / ${state.checklist.length}`;
      if (!state.checklist.length) {
        box.innerHTML = `<p class="empty">還沒有角色期待。看劇情、回應角色後，這裡會記錄下次露營要準備的事。</p>`;
        return;
      }
      box.innerHTML = state.checklist.map((c) => {
        const char = state.characters[c.sourceCharacter];
        const icon = c.status === "done" ? "✓" : "!";
        const title = `${char.name}：「${c.sourceText}」\n需要分類：${c.requiredTags.join(" / ")}`;
        return `
          <div class="check ${c.status}" title="${escapeAttr(title)}">
            <div class="status">${c.status === "done" && isCampingScene() ? avatarHtml(c.sourceCharacter) : icon}</div>
            <div>
              <b>${c.label}</b>
              <span>${char.name} 的提示：${c.sourceText}</span>
              <div class="tags" style="margin:7px 0 0;">${c.requiredTags.map((tag) => `<span class="mini-tag">${tag}</span>`).join("")}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    function renderInventory() {
      document.getElementById("loadTag").textContent = `${totalLoad()} / ${state.loadMax}`;
      const box = document.getElementById("inventory");
      if (!state.bag.length) {
        box.innerHTML = `<p class="empty">背包還是空的。採買時先看黃色標記，它們通常能回應角色剛剛說過的事。</p>`;
        return;
      }
      box.innerHTML = state.bag.map((it) => `
        <div class="bag-item">
          <div>
            <b>${it.name}</b>
            <small>${it.tags.join(" / ")}</small>
          </div>
          <span>${it.weight}</span>
        </div>
      `).join("");
    }

    function renderMeters() {
      const box = document.getElementById("meters");
      const rows = ["rin", "nadeshiko", "chiaki"].map((id) => {
        const char = state.characters[id];
        const value = Math.max(0, Math.min(100, char.affection + char.trust + char.sync + char.tendency));
        return `
          <div class="meter-row">
            ${avatarHtml(id, "mini-avatar")}
            <span>${char.name.slice(-2)}</span>
            <div class="meter"><span style="width:${value}%; background:${char.color}"></span></div>
            <b>${value}</b>
          </div>
        `;
      }).join("");
      const resources = `
        <div class="meter-row">
          <span></span>
          <span>體力</span>
          <div class="meter"><span style="width:${state.stamina}%; background:#6c8b4f"></span></div>
          <b>${state.stamina}</b>
        </div>
      `;
      box.innerHTML = rows + resources;
    }

    function renderLog() {
      const box = document.getElementById("log");
      box.innerHTML = state.log.slice(0, 8).map((line) => `<li>${line}</li>`).join("");
    }

    function escapeAttr(text) {
      return String(text).replaceAll("&", "&amp;").replaceAll('"', "&quot;").replaceAll("<", "&lt;");
    }

    document.getElementById("restartBtn").addEventListener("click", newGame);
    document.getElementById("helpBtn").addEventListener("click", () => {
      alert("玩法：先看角色對話。角色提到的期待會變成右側 checklist。商店中黃色標記代表該商品能完成某項期待。買到符合分類的物品後，目標會打勾。週六露營會依完成度演出不同劇情。");
    });
    newGame();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>搖曳露營 GALGAME Prototype</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <section class="topbar">
      <div>
        <h1>第一週測試版</h1>
        <p class="subtitle">看角色對話，記下她們下次露營想要的東西。採買時有顏色標記與提示，買到符合分類的物品後 checklist 會打勾，週末依完成度演出不同劇情。</p>
      </div>
      <div class="toolbar">
        <button class="btn" id="helpBtn">玩法</button>
        <button class="btn" id="saveBtn">存檔</button>
        <button class="btn" id="loadBtn">讀檔</button>
        <button class="btn primary" id="restartBtn">重新開始</button>
      </div>
    </section>

    <section class="layout">
      <div class="panel">
        <div class="panel-header">
          <h2 id="phaseTitle">週一</h2>
          <span class="tag" id="moneyTag">預算 3000</span>
        </div>
        <div class="content">
          <div class="week" id="week"></div>
          <div class="scene">
            <div class="scene-label" id="sceneLabel">第一週的目標：把角色說過的小事，變成真正準備好的露營。</div>
          </div>
          <h2 class="event-title" id="eventTitle"></h2>
          <div class="dialogue">
            <div class="speaker">
              <div class="avatar" id="speakerAvatar">主</div>
              <span id="speakerName">主角</span>
            </div>
            <p id="dialogueText"></p>
          </div>
          <div id="mainAction"></div>
        </div>
      </div>

      <aside class="side">
        <div class="panel">
          <div class="panel-header">
            <h2>下次露營 Checklist</h2>
            <span class="tag yellow" id="checkProgress">0 / 0</span>
          </div>
          <div class="content">
            <div class="checklist" id="checklist"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>背包</h2>
            <span class="tag blue" id="loadTag">負重 0 / 10</span>
          </div>
          <div class="content">
            <div class="inventory" id="inventory"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>Build</h2>
            <span class="tag yellow" id="buildProgress">0</span>
          </div>
          <div class="content">
            <div class="builds" id="builds"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>路線進度</h2>
            <span class="tag" id="routeTag">觀察中</span>
          </div>
          <div class="content">
            <div class="route-progress" id="routeProgress"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>角色狀態</h2>
            <span class="tag">第一週</span>
          </div>
          <div class="content">
            <div class="meters" id="meters"></div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <h2>露營筆記</h2>
            <span class="tag">Log</span>
          </div>
          <div class="content">
            <ul class="log" id="log"></ul>
          </div>
        </div>
      </aside>
    </section>
  </main>
  <script src="js/utils.js"></script>
  <script src="data/characters.js"></script>
  <script src="data/items.js"></script>
  <script src="data/week1.js"></script>
  <script src="data/week2.js"></script>
  <script src="data/combos.js"></script>
  <script src="js/state.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/render.js"></script>
  <script src="js/save.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
